spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/helpdesk_db}
spring.datasource.username=${DB_USERNAME:helpdesk_user}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.websocket.max-session-idle-timeout=300000
file.upload-dir=uploads
